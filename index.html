<!DOCTYPE html>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傲娇图鉴 · TSUNDERE ARCHIVE</title>
<meta name="description" content="这里收着我这些年被「べ、別に…」戳中的那些瞬间。">
<style>
  body{ margin:0; }
  /* 只在开场还没结束的时候锁滚动；开场一结束就交还给页面 */
  html.intro-pending body{ visibility:hidden; }
  html.intro-pending, html.intro-pending body{ overflow:hidden; }
  html.intro-done, html.intro-done body{ height:auto; overflow:visible; }
</style>
<script>
  /* 开场盖上来之前先藏住正文，避免一闪。
     播不播只在这里判一次，结果写到 <html data-intro>，intro.js 照着它执行。
     规则：?intro=0 跳过；?intro=1 重播；?introat= 调试定格必播；
           从站内页面点回来的不播；同一个标签里已经播过的（sessionStorage）不播。
     记忆只放 sessionStorage —— 新开浏览器或新标签会再播一次，关掉即重置。 */
  (function () {
    var KEY = 'tsundere.intro.v1';
    var q = new URLSearchParams(location.search);
    var play = true;
    if (q.get('intro') === '1') play = true;
    else if (q.get('intro') === '0') play = false;
    else if (q.get('introat') !== null) play = true;
    else if (q.get('view') === 'home') play = false;
    else if (document.referrer && document.referrer.indexOf(location.origin) === 0) play = false;
    else {
      try { if (sessionStorage.getItem(KEY) === '1') play = false; } catch (e) {}
    }
    /* 旧版本把标记写进了 localStorage（等于永远不播），这里顺手清掉 */
    try { localStorage.removeItem(KEY); } catch (e) {}
    document.documentElement.setAttribute('data-intro', play ? 'play' : 'skip');
    if (play) {
      var h = document.documentElement;
      h.classList.add('intro-pending');
      setTimeout(function () { h.classList.remove('intro-pending'); }, 4000);  /* 兜底 */
    }
  })();
</script>
